[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-code-toolkit-template-sync"
dynamic = ["version"]
description = "template-sync-tools MCP server, shipped from claude-code-toolkit"
requires-python = ">=3.11"
# mcp 2.x renamed FastMCP; the moved v0.3.8 server targets the 1.x API
dependencies = ["mcp[cli]>=1.2,<2"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
mcp-template-sync-tools = "template_sync.mcp:main"

[tool.hatch.version]
path = "src/template_sync/VERSION"
pattern = "^(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+)"

[tool.hatch.build.targets.wheel]
packages = ["src/template_sync"]

[tool.hatch.build]
include = ["src/template_sync/**", "src/template_sync/VERSION"]
